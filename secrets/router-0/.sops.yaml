# router-0 is not a NixOS host and has no sops-nix, so its secrets are not
# consumed by an activation script keyed to the system identity. They are
# pushed by an operator running `nix run .#router-0-config`, so they are
# encrypted to the operator identity instead. This keeps the common deploy
# path free of passphrase prompts.
creation_rules:
  - path_regex: (^|/)deploy\.yaml$
    age:
      - age12ntz9447fuyuz3h7hkp0yn6dca2v44f759nrunawqcjv90lp0yqsfahjk4
