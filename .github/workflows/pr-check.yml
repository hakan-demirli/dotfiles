name: PR Check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/main.yml
  flake-check:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
