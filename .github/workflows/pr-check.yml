name: "PR Check"
on:
  pull_request:
    branches: ["main"]
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fast-checks:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-22.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: Run fast checks
        run: |
          set -euo pipefail
          checks=$(nix eval --json ".#checks.${{ matrix.system }}" --apply 'builtins.attrNames' \
            | jq -r '.[] | select((startswith("test-") or startswith("host-")) | not)')
          if [[ -z $checks ]]; then
            echo "No fast checks found for ${{ matrix.system }}"
            exit 1
          fi
          while IFS= read -r check; do
            if [[ "${{ matrix.system }}" == "aarch64-linux" && "$check" == "ephemeral-root" ]]; then
              echo "Skipping $check on aarch64-linux (requires KVM)"
              continue
            fi
            echo "Building checks.${{ matrix.system }}.$check"
            nix build ".#checks.${{ matrix.system }}.$check"
          done <<< "$checks"
  device-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: Evaluate device packages
        run: |
          set -euo pipefail
          devices=$(nix eval --json '.#devices' --apply 'builtins.attrNames')
          packages=$(nix eval --json '.#packages.x86_64-linux' --apply 'builtins.attrNames')
          mapfile -t device_packages < <(
            jq -nr --argjson devices "$devices" --argjson packages "$packages" '
              $packages[] as $package
              | select(any($devices[]; . as $device | $package | startswith($device + "-")))
              | $package
            '
          )
          if (( ${#device_packages[@]} == 0 )); then
            echo "No device packages found"
            exit 1
          fi
          for package in "${device_packages[@]}"; do
            echo "Evaluating $package"
            nix eval --raw ".#packages.x86_64-linux.$package.drvPath"
            echo
          done
  flake-check:
    name: flake-check
    needs: [fast-checks, device-packages]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          for r in \
            "fast-checks=${{ needs.fast-checks.result }}" \
            "device-packages=${{ needs.device-packages.result }}"
          do
            name="${r%=*}"; result="${r#*=}"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then exit 1; fi
          done
