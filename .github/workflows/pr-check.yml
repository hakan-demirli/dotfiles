name: "PR Check"
on:
  pull_request:
    branches: ["main"]
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fast-checks:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-22.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: Run fast checks
        run: |
          set -euo pipefail
          checks=$(nix eval --json ".#checks.${{ matrix.system }}" --apply 'builtins.attrNames' \
            | jq -r '.[] | select((startswith("test-") or startswith("host-")) | not)')
          if [[ -z $checks ]]; then
            echo "No fast checks found for ${{ matrix.system }}"
            exit 1
          fi
          while IFS= read -r check; do
            if [[ "${{ matrix.system }}" == "aarch64-linux" && "$check" == "ephemeral-root" ]]; then
              echo "Skipping $check on aarch64-linux (requires KVM)"
              continue
            fi
            echo "Building checks.${{ matrix.system }}.$check"
            nix build ".#checks.${{ matrix.system }}.$check"
          done <<< "$checks"
  flake-check:
    name: flake-check
    needs: [fast-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify fast checks passed
        run: |
          if [[ "${{ needs.fast-checks.result }}" != "success" ]]; then
            echo "One or more fast checks failed"
            exit 1
          fi
