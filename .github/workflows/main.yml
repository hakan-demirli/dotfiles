name: "Nix Build and Test"
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    uses: hakan-demirli/infra-lib/.github/workflows/checks.yml@22e18d2a5126029f1229400e89766be95db5dc98
  external-builds:
    uses: hakan-demirli/infra-lib/.github/workflows/external-builds.yml@22e18d2a5126029f1229400e89766be95db5dc98
  flake-check:
    needs: [checks, external-builds]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length == 2 and all(.[]; .result == "success")' <<< "$RESULTS"
