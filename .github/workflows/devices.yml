name: "Devices"
on:
  pull_request:
    branches: [unstable]
  push:
    branches: [unstable]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: devices-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  devices:
    uses: hakan-demirli/infra-lib/.github/workflows/external-builds.yml@0dc22f2cf5d3ff2e3e38b76190a7d1256e1be9a2
