name: "Devices"
on:
  pull_request:
    branches: [unstable]
  push:
    branches: [unstable]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: devices-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  devices:
    uses: hakan-demirli/infra-lib/.github/workflows/external-builds.yml@a6fab821053ca72cc23b6984a013c1056bbd695e
